<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<title>双路 3D 骨架回放</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #ddd; font: 13px/1.4 system-ui, sans-serif; }
  #app { display: grid; grid-template-columns: 1fr 1.1fr 1fr; grid-template-rows: 1fr 64px; height: 100%; }
  .pane {
    position: relative; background: #000; min-width: 0; min-height: 0;
    border-right: 1px solid #222; container-type: size;
    display: grid; place-items: center;
  }
  .stage {
    position: relative;
    width: min(100cqw, calc(100cqh * 16 / 9));
    aspect-ratio: 16 / 9;
    background: #000;
  }
  .stage video, .stage canvas.frame, .stage canvas.ov {
    display: block; width: 100%; height: 100%;
  }
  .stage video { object-fit: cover; object-position: left center; }
  .stage canvas.frame { position: absolute; inset: 0; }
  .stage canvas.ov { position: absolute; inset: 0; pointer-events: none; }
  #view3d { position: relative; min-width: 0; min-height: 0; }
  #c { display: block; width: 100%; height: 100%; }
  .tag { position: absolute; left: 8px; top: 8px; background: rgba(0,0,0,.7); padding: 2px 8px; z-index: 2; }
  #hud {
    position: absolute; left: 8px; bottom: 8px; z-index: 2;
    background: rgba(0,0,0,.7); padding: 4px 8px; font-variant-numeric: tabular-nums;
  }
  #hud .near { color: #3dd68c; }
  #hud .far { color: #8ab4ff; }
  #hud .alarm { color: #ff6677; font-weight: 600; }
  #bar {
    grid-column: 1 / -1;
    display: flex; gap: 10px; align-items: center;
    padding: 8px 14px; border-top: 1px solid #333; background: #181818;
  }
  #bar input[type=range] { flex: 1; }
  #bar label { display: flex; align-items: center; gap: 6px; color: #bbb; white-space: nowrap; }
  #bar input[type=number] {
    width: 64px; background: #222; color: #ddd; border: 1px solid #444; padding: 2px 4px;
  }
  button { background: #2a2a2a; color: #eee; border: 1px solid #444; padding: 5px 12px; cursor: pointer; }
  #tlab { width: 92px; color: #bbb; font-variant-numeric: tabular-nums; }
  #hint { color: #777; }
</style>
</head>
<body>
<div id="app">
  <div class="pane">
    <span class="tag">左路 · 1-3组-1</span>
    <div class="stage">
      <video id="vid" playsinline muted preload="auto"></video>
      <canvas class="ov" id="ovL"></canvas>
    </div>
  </div>
  <div id="view3d">
    <span class="tag">巷道 3D · 拖拽旋转</span>
    <div id="hud">—</div>
    <canvas id="c"></canvas>
  </div>
  <div class="pane">
    <span class="tag">右路 · 1-3组-2</span>
    <div class="stage">
      <canvas class="frame" id="frameR"></canvas>
      <canvas class="ov" id="ovR"></canvas>
    </div>
  </div>
  <div id="bar">
    <button id="btnPlay">播放</button>
    <input type="range" id="seek" min="0" max="1000" value="0" step="0.04">
    <span id="tlab">0:00</span>
    <label>报警阈值 m <input type="number" id="contactM" step="0.01" value="0"></label>
    <span id="hint">空格播放 · ←→ 跳 2 秒 · 有向距离小于阈值才变红（0=伸进墙）</span>
  </div>
</div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { contactSlots, makeLayerMesh, meshCells, projectCorners, DEFAULT_LAYER_PITCH, DEFAULT_CONTACT_M } from '/dualcam_geom.js';

const DATA = await fetch('/api/skel3d').then((r) => r.json());
const CALIB = await fetch('/api/calib').then((r) => r.json()).catch(() => ({}));
const vid = document.getElementById('vid');
const frameR = document.getElementById('frameR');
const ovL = document.getElementById('ovL');
const ovR = document.getElementById('ovR');
const ctxFrameR = frameR.getContext('2d', { alpha: false });
const seek = document.getElementById('seek');
const tlab = document.getElementById('tlab');
const hud = document.getElementById('hud');
const btn = document.getElementById('btnPlay');
const frames = DATA.frames;
const times = frames.map((f) => f.t);

function fmt(t) {
  const m = Math.floor(t / 60);
  const s = Math.floor(t % 60);
  return `${m}:${String(s).padStart(2, '0')}`;
}
function nearest(t) {
  let lo = 0, hi = times.length - 1;
  while (lo < hi) {
    const mid = (lo + hi) >> 1;
    if (times[mid] < t) lo = mid + 1;
    else hi = mid;
  }
  if (lo > 0 && Math.abs(times[lo - 1] - t) < Math.abs(times[lo] - t)) return lo - 1;
  return lo;
}
function dClass(d) {
  if (d == null) return '';
  return d < contactM ? 'near' : 'far';
}
function dTxt(d) {
  return d == null ? '—' : `${d.toFixed(2)}m`;
}

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(1);
const viewCam = new THREE.PerspectiveCamera(50, 1, 0.05, 40);
viewCam.position.set(3.6, 3.4, 1.1);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111111);
const controls = new OrbitControls(viewCam, canvas);
controls.target.set(0, 0.9, 1.1);
controls.enableDamping = true;
scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const dir = new THREE.DirectionalLight(0xffffff, 0.7);
dir.position.set(2, 6, 1);
scene.add(dir);
scene.add(new THREE.GridHelper(8, 16, 0x3a3a3a, 0x2a2a2a));

const wallMat = [
  new THREE.MeshPhongMaterial({ color: 0x3d8a5a, transparent: true, opacity: 0.22, side: THREE.DoubleSide, depthWrite: false }),
  new THREE.MeshPhongMaterial({ color: 0x2f6f9f, transparent: true, opacity: 0.22, side: THREE.DoubleSide, depthWrite: false }),
];
for (const w of DATA.walls) {
  const c = w.corners;
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute([
    ...c[0], ...c[1], ...c[2], ...c[0], ...c[2], ...c[3],
  ], 3));
  scene.add(new THREE.Mesh(geo, wallMat[w.wall_id === 1 ? 0 : 1]));
  const lg = new THREE.BufferGeometry();
  lg.setAttribute('position', new THREE.Float32BufferAttribute([...c[0], ...c[1], ...c[1], ...c[2], ...c[2], ...c[3], ...c[3], ...c[0]], 3));
  scene.add(new THREE.LineSegments(lg, new THREE.LineBasicMaterial({ color: w.wall_id === 1 ? 0x5c8 : 0x6af })));
}

function addCam(cam, color) {
  const g = new THREE.Group();
  const ball = new THREE.Mesh(new THREE.SphereGeometry(0.07, 10, 10), new THREE.MeshBasicMaterial({ color }));
  ball.position.set(...cam.C);
  g.add(ball);
  g.add(new THREE.ArrowHelper(new THREE.Vector3(...cam.fwd), new THREE.Vector3(...cam.C), 0.55, color, 0.12, 0.08));
  scene.add(g);
}
addCam(DATA.cameras.L, 0xffcc66);
addCam(DATA.cameras.R, 0xff8866);

let contactM = Number.isFinite(Number(CALIB.contact_m)) ? Number(CALIB.contact_m) : DEFAULT_CONTACT_M;
const inpContact = document.getElementById('contactM');
inpContact.value = String(contactM);
inpContact.addEventListener('input', () => {
  const v = Number(inpContact.value);
  if (!Number.isFinite(v)) return;
  contactM = v;
  lastIdx = -1;
  lastPaintSig = null;
  show(vid.currentTime || 0);
});
const solved = (CALIB.solved && CALIB.solved.ok) ? CALIB.solved : { walls: DATA.walls || [] };
const slotMeshes = (CALIB.slot_meshes && CALIB.slot_meshes.length)
  ? CALIB.slot_meshes
  : (DATA.walls || []).map((w) => makeLayerMesh(w.wall_id, w.corners, DEFAULT_LAYER_PITCH, 4, 4));

const idleFill = new THREE.MeshBasicMaterial({
  color: 0x3a6a88, transparent: true, opacity: 0.16, side: THREE.DoubleSide, depthWrite: false,
});
const alarmFill = new THREE.MeshBasicMaterial({
  color: 0xff3344, transparent: true, opacity: 0.78, side: THREE.DoubleSide, depthWrite: false,
});
const idleLine = new THREE.LineBasicMaterial({ color: 0x7ec8ff });
const alarmLine = new THREE.LineBasicMaterial({ color: 0xff5566 });
const slotObjs = [];
for (const mesh of slotMeshes) {
  for (const cell of meshCells(mesh)) {
    const c = cell.corners;
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute([
      ...c[0], ...c[1], ...c[2], ...c[0], ...c[2], ...c[3],
    ], 3));
    const fill = new THREE.Mesh(geo, idleFill);
    scene.add(fill);
    const lg = new THREE.BufferGeometry();
    lg.setAttribute('position', new THREE.Float32BufferAttribute(
      [...c[0], ...c[1], ...c[1], ...c[2], ...c[2], ...c[3], ...c[3], ...c[0]], 3));
    const line = new THREE.LineSegments(lg, idleLine);
    scene.add(line);
    slotObjs.push({ key: `${mesh.wall_id}:${cell.box_id}`, fill, line });
  }
}

function frameHits(fr) {
  const hits = [];
  const wrist = { 9: [], 10: [] };
  if (fr && fr.ok) {
    for (const idx of [9, 10]) {
      const h = contactSlots(fr.xyz && fr.xyz[idx], slotMeshes, solved, contactM);
      wrist[idx] = h;
      hits.push(...h);
    }
  }
  return { hits, keys: new Set(hits.map((h) => `${h.wall_id}:${h.box_id}`)), wrist };
}

let lastPaintSig = null;
function paintSlots(keys) {
  const sig = [...keys].sort().join(',');
  if (sig === lastPaintSig) return;
  lastPaintSig = sig;
  for (const s of slotObjs) {
    const on = keys.has(s.key);
    s.fill.material = on ? alarmFill : idleFill;
    s.line.material = on ? alarmLine : idleLine;
  }
}

const skelGroup = new THREE.Group();
scene.add(skelGroup);
const jointGeo = new THREE.SphereGeometry(0.032, 8, 8);
const boneMat = new THREE.LineBasicMaterial({ color: 0x66e0ff });
const jointMat = new THREE.MeshBasicMaterial({ color: 0x66e0ff });
const wristMats = {
  near: new THREE.MeshBasicMaterial({ color: 0x3dd68c }),
  far: new THREE.MeshBasicMaterial({ color: 0xffa23c }),
};
const joints = [];
for (let i = 0; i < 17; i++) {
  const m = new THREE.Mesh(jointGeo, jointMat);
  m.visible = false;
  skelGroup.add(m);
  joints.push(m);
}
const boneAttr = new THREE.Float32BufferAttribute(new Float32Array(DATA.edges.length * 6), 3);
const boneGeo = new THREE.BufferGeometry();
boneGeo.setAttribute('position', boneAttr);
const boneLine = new THREE.LineSegments(boneGeo, boneMat);
skelGroup.add(boneLine);

const slotProj = { L: [], R: [] };
for (const side of ['L', 'R']) {
  const cam = DATA.cameras[side];
  for (const mesh of slotMeshes) {
    for (const cell of meshCells(mesh)) {
      slotProj[side].push({
        key: `${mesh.wall_id}:${cell.box_id}`,
        label: `墙${mesh.wall_id} ${cell.box_id}`,
        poly: cam ? projectCorners(cell.corners, cam) : null,
      });
    }
  }
}

function resize3d() {
  const box = canvas.parentElement.getBoundingClientRect();
  const w = Math.max(1, box.width), h = Math.max(1, box.height);
  renderer.setSize(w, h, false);
  viewCam.aspect = w / h;
  viewCam.updateProjectionMatrix();
}
new ResizeObserver(resize3d).observe(canvas.parentElement);

function draw3d(fr, keys, wrist) {
  paintSlots(keys);
  if (!fr || !fr.ok) {
    skelGroup.visible = false;
    return;
  }
  skelGroup.visible = true;
  const xyz = fr.xyz;
  for (let i = 0; i < 17; i++) {
    const p = xyz[i];
    const m = joints[i];
    if (!p) { m.visible = false; continue; }
    m.visible = true;
    m.position.set(p[0], p[1], p[2]);
    if (i === 9 || i === 10) {
      const alarm = wrist[i] && wrist[i].length > 0;
      const d = i === 9 ? fr.dL : fr.dR;
      m.material = (alarm || (d != null && d < contactM)) ? wristMats.near : wristMats.far;
    } else {
      m.material = jointMat;
    }
  }
  const arr = boneAttr.array;
  let n = 0;
  for (const [a, b] of DATA.edges) {
    if (!xyz[a] || !xyz[b]) continue;
    arr[n++] = xyz[a][0]; arr[n++] = xyz[a][1]; arr[n++] = xyz[a][2];
    arr[n++] = xyz[b][0]; arr[n++] = xyz[b][1]; arr[n++] = xyz[b][2];
  }
  boneAttr.needsUpdate = true;
  boneGeo.setDrawRange(0, n / 3);
}

function drawSlots2d(ctx, w, h, side, keys) {
  const sx = w / 1280, sy = h / 720;
  for (const cell of slotProj[side]) {
    const poly = cell.poly;
    if (!poly) continue;
    const alarm = keys.has(cell.key);
    ctx.beginPath();
    poly.forEach((p, i) => {
      const x = p[0] * sx, y = p[1] * sy;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.closePath();
    ctx.fillStyle = alarm ? 'rgba(255,50,60,.45)' : 'rgba(80,160,220,.10)';
    ctx.fill();
    ctx.strokeStyle = alarm ? '#ff4455' : 'rgba(120,180,220,.55)';
    ctx.lineWidth = alarm ? 3 : 1;
    ctx.stroke();
    if (alarm) {
      const cx = poly.reduce((s, p) => s + p[0], 0) / 4 * sx;
      const cy = poly.reduce((s, p) => s + p[1], 0) / 4 * sy;
      ctx.fillStyle = '#ff99a6';
      ctx.font = '12px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(cell.label, cx, cy);
    }
  }
}

function draw2d(cv, fr, side, keys, wrist) {
  const w = cv.clientWidth, h = cv.clientHeight;
  if (!w || !h) return;
  if (cv.width !== w) cv.width = w;
  if (cv.height !== h) cv.height = h;
  const ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, w, h);
  drawSlots2d(ctx, w, h, side, keys);
  const kpts = fr && (side === 'L' ? fr.L : fr.R);
  const scores = fr && (side === 'L' ? fr.sL : fr.sR);
  if (!kpts || !scores) return;
  const sx = w / 1280, sy = h / 720;
  ctx.lineWidth = 2;
  ctx.strokeStyle = '#66e0ff';
  for (const [a, b] of DATA.edges) {
    if (scores[a] < DATA.kpt_min || scores[b] < DATA.kpt_min) continue;
    ctx.beginPath();
    ctx.moveTo(kpts[a][0] * sx, kpts[a][1] * sy);
    ctx.lineTo(kpts[b][0] * sx, kpts[b][1] * sy);
    ctx.stroke();
  }
  for (let i = 0; i < 17; i++) {
    if (scores[i] < DATA.kpt_min) continue;
    const wristHit = (i === 9 || i === 10) && wrist[i] && wrist[i].length > 0;
    ctx.beginPath();
    ctx.arc(kpts[i][0] * sx, kpts[i][1] * sy, i === 9 || i === 10 ? 5 : 3, 0, Math.PI * 2);
    ctx.fillStyle = (i === 9 || i === 10) ? (wristHit ? '#3dd68c' : '#ffa23c') : '#66e0ff';
    ctx.fill();
  }
}

function blitRight() {
  const w = frameR.clientWidth, h = frameR.clientHeight;
  if (!w || !h || vid.readyState < 2) return;
  if (frameR.width !== w) frameR.width = w;
  if (frameR.height !== h) frameR.height = h;
  const vw = vid.videoWidth || 2560, vh = vid.videoHeight || 720;
  ctxFrameR.drawImage(vid, vw / 2, 0, vw / 2, vh, 0, 0, w, h);
}

let lastIdx = -1;
function show(t) {
  tlab.textContent = fmt(t);
  if (Math.abs(Number(seek.value) - t) > 0.05) seek.value = String(t);
  const idx = nearest(t);
  const fr = frames[idx];
  if (idx !== lastIdx) {
    lastIdx = idx;
    const { hits, keys, wrist } = frameHits(fr);
    draw3d(fr, keys, wrist);
    draw2d(ovL, fr, 'L', keys, wrist);
    draw2d(ovR, fr, 'R', keys, wrist);
    if (!fr || !fr.ok) {
      hud.textContent = '未配对';
      hud.className = '';
    } else {
      const uniq = [...new Set(hits.map((h) => `墙${h.wall_id} ${h.box_id}`))];
      hud.innerHTML =
        `交会 ${fr.gap.toFixed(2)}m<br>` +
        `<span class="${dClass(fr.dL)}">左腕 ${dTxt(fr.dL)}</span>　` +
        `<span class="${dClass(fr.dR)}">右腕 ${dTxt(fr.dR)}</span><br>` +
        (uniq.length
          ? `<span class="alarm">报警 ${uniq.join(' · ')}</span>`
          : '报警 无');
    }
  }
}

function setTime(t) {
  t = Math.max(0, Math.min(vid.duration || 1000, t));
  vid.currentTime = t;
  show(t);
}

vid.src = '/api/video';
vid.addEventListener('loadedmetadata', () => {
  seek.max = String(vid.duration);
  show(0);
  blitRight();
});
vid.addEventListener('loadeddata', blitRight);
vid.addEventListener('seeked', blitRight);
btn.onclick = () => {
  if (vid.paused) {
    vid.play();
    btn.textContent = '暂停';
  } else {
    vid.pause();
    btn.textContent = '播放';
  }
};
seek.oninput = () => {
  vid.pause();
  btn.textContent = '播放';
  setTime(Number(seek.value));
};
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space') { e.preventDefault(); btn.click(); }
  if (e.code === 'ArrowLeft') setTime(vid.currentTime - 2);
  if (e.code === 'ArrowRight') setTime(vid.currentTime + 2);
});

function tick() {
  if (!vid.paused) {
    blitRight();
    show(vid.currentTime);
  }
  controls.update();
  if (!document.hidden) renderer.render(scene, viewCam);
  requestAnimationFrame(tick);
}
for (const el of document.querySelectorAll('.stage')) {
  new ResizeObserver(() => {
    lastIdx = -1;
    blitRight();
    show(vid.currentTime || 0);
  }).observe(el);
}
resize3d();
tick();
</script>
</body>
</html>
