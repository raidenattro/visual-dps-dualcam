<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<title>双路拣货面标注</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; color: #ddd; font: 13px/1.4 system-ui, sans-serif; }
  #app { display: grid; grid-template-columns: 1fr 340px; height: 100%; }
  #views { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 10px 10px 70px; min-width: 0; }
  .pane { position: relative; background: #000; border: 1px solid #333; min-height: 0; }
  .pane.on { border-color: #5c8; }
  .pane video {
    display: block; width: 100%; aspect-ratio: 1280 / 720; height: auto; background: #000;
    object-fit: cover;
  }
  .pane video.L { object-position: left center; }
  .pane video.R { object-position: right center; }
  .pane canvas.ov { position: absolute; left: 0; top: 0; width: 100%; aspect-ratio: 1280 / 720; cursor: crosshair; }
  .tag { position: absolute; left: 8px; top: 8px; background: rgba(0,0,0,.7); padding: 2px 8px; color: #fff; }
  #panel { border-left: 1px solid #333; padding: 12px; overflow: auto; }
  h1 { margin: 0 0 8px; font-size: 15px; color: #fff; }
  h1 a { font-size: 13px; font-weight: 400; color: #9ad; }
  .muted { color: #8a8a8a; }
  .hint { color: #e0b060; min-height: 3.2em; margin: 8px 0; }
  label { display: flex; align-items: center; gap: 8px; margin: 5px 0; }
  label span { width: 112px; color: #bbb; flex-shrink: 0; }
  input[type=number], input[type=text], select { width: 72px; background: #222; color: #ddd; border: 1px solid #444; padding: 2px 4px; }
  select { width: 168px; }
  select.grow { width: auto; flex: 1; min-width: 0; }
  .pane video.full { object-fit: contain; object-position: center center; }
  .same-side-only { display: none; }
  table { border-collapse: collapse; width: 100%; margin: 6px 0; }
  th, td { padding: 3px 4px; text-align: left; font-weight: 400; color: #bbb; }
  tr.active td { background: #24323d; }
  tr.w1 td:first-child { color: #5cf08a; }
  tr.w2 td:first-child { color: #d89bff; }
  button { background: #2a2a2a; color: #eee; border: 1px solid #444; padding: 5px 10px; cursor: pointer; }
  button.pri { background: #2a4a3a; border-color: #5c8; }
  hr.sep { border: 0; border-top: 1px solid #333; margin: 12px 0; }
  #bar {
    position: fixed; left: 10px; right: 350px; bottom: 10px;
    background: rgba(18,18,18,.95); border: 1px solid #333; padding: 8px 12px;
    display: flex; gap: 10px; align-items: center;
  }
  #bar input[type=range] { flex: 1; }
  #msg { margin-top: 8px; color: #9ad; white-space: pre-wrap; }
  #btns { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
</style>
</head>
<body>
<div id="app">
  <div id="views">
    <div class="pane on" data-view="L">
      <span class="tag" id="tagL">左路 · 144</span>
      <video id="vidL" class="L" playsinline muted preload="auto"></video>
      <canvas id="cvL" class="ov"></canvas>
    </div>
    <div class="pane" data-view="R">
      <span class="tag" id="tagR">右路 · 24</span>
      <video id="vidR" class="R" playsinline muted preload="auto"></video>
      <canvas id="cvR" class="ov"></canvas>
    </div>
  </div>
  <div id="panel">
    <h1>双路拣货面 <a href="/play">3D 回放</a></h1>
    <div class="muted" id="intro">每一路都能标<strong>左右两面墙</strong>：墙1 绿色（81）、墙2 紫色（82）。点表格或点画面上的墙切换；点哪路画面就标哪路。点序相对本机 ①顶远 ②顶近 ③底近 ④底远。</div>
    <div class="muted">标定文件 <code id="calibPath">output/calib/dual_144-24.json</code></div>
    <label><span>画面</span>
      <select id="videoMode">
        <option value="stitched">拼接片（左右半幅）</option>
        <option value="split">左右各一路文件</option>
      </select>
    </label>
    <label id="rowSrc"><span>视频</span><select id="videoSrc" class="grow"></select></label>
    <label id="rowSrcL" class="split-only"><span>左路视频</span><select id="videoSrcL" class="grow"></select></label>
    <label id="rowSrcR" class="split-only"><span>右路视频</span><select id="videoSrcR" class="grow"></select></label>
    <label><span>机位布局</span>
      <select id="layout">
        <option value="opposite">对向（巷道两端对打）</option>
        <option value="same_side" selected>同侧（同端同向）</option>
      </select>
    </label>
    <label><span>标注墙</span>
      <input type="checkbox" id="singleWall"> 两路只标同一面
    </label>
    <div class="hint" id="hint"></div>
    <table>
      <tr><th>墙</th><th>面宽</th><th>面高</th><th>底沿</th><th>L</th><th>R</th></tr>
      <tbody id="rows"></tbody>
    </table>
    <label><span>巷道净宽 m</span><input type="number" id="aisle" step="0.01" value="2.00"></label>
    <div class="muted" style="margin-top:8px" id="priorHint">卷尺初值（先验，可改）。相机高、离近端分左右路，两端可以不同。</div>
    <label><span>左路相机高 m</span><input type="number" id="camHL" step="0.05" value="2.84"></label>
    <label><span>右路相机高 m</span><input type="number" id="camHR" step="0.05" value="2.84"></label>
    <label><span>左路离近端 m</span><input type="number" id="camDistL" step="0.05" value="1.56"></label>
    <label><span>右路离近端 m</span><input type="number" id="camDistR" step="0.05" value="1.56"></label>
    <label class="same-side-only"><span>左路到81 m</span><input type="number" id="wallDist81L" step="0.05" value=""></label>
    <label class="same-side-only"><span>左路到82 m</span><input type="number" id="wallDist82L" step="0.05" value=""></label>
    <label class="same-side-only"><span>右路到81 m</span><input type="number" id="wallDist81R" step="0.05" value=""></label>
    <label class="same-side-only"><span>右路到82 m</span><input type="number" id="wallDist82R" step="0.05" value=""></label>
    <label><span>俯仰 °</span><input type="number" id="pitch" step="1" value="45"></label>
    <label><span>画面叠加</span>
      <input type="checkbox" id="onlyActiveWall" checked> 只显示当前墙
    </label>
    <label><span></span>
      <input type="checkbox" id="hideSolvedOverlay" checked> 隐藏反解空心角（避免与实心点重复）
    </label>
    <div id="btns">
      <button id="btnUndo">撤销墙角</button>
      <button id="btnClear">清空本墙本路</button>
      <button id="btnClearView">清空本路全部墙</button>
      <button class="pri" id="btnSolve">1. 反解并对齐</button>
      <button id="btnSave">保存</button>
    </div>
    <hr class="sep"/>
    <div class="muted">反解后生成本墙层线，再<strong>逐条拖分格线</strong>对齐隔板。各层高度独立，不再等距；列仍沿墙面均分。</div>
    <label><span>层数</span><input type="number" id="nLayers" min="1" max="8" step="1" value="4"></label>
    <label><span>列数</span><input type="number" id="nCols" min="1" max="8" step="1" value="4"></label>
    <label><span>报警阈值 m</span><input type="number" id="contactM" step="0.01" value="0"></label>
    <div class="muted">腕点到墙的有向距离 <strong>小于</strong> 该值才报警。0 = 伸进墙面；正数（如 0.10）= 离墙还有余量也报。</div>
    <div id="btns">
      <button class="pri" id="btnGen">2. 生成本墙层线</button>
      <button id="btnGenBoth">两墙都生成</button>
      <button id="btnResetMesh">重置本墙</button>
      <button id="btnDelMesh">删除本墙层线</button>
    </div>
    <div class="muted" id="slotCount">还没有层线</div>
    <div id="msg"></div>
  </div>
</div>
<div id="bar">
  <button id="btnPlay">播放</button>
  <input type="range" id="seek" min="0" max="1000" value="0" step="1">
  <span id="tlab">0:00</span>
</div>
<script type="module">
import {
  makeLayerMesh, meshCells, meshFromRowYs, moveLayerRow, pointInPolygon,
  projectPix, rayPlane, rowYsFromMesh, vertIndex, wallById, wallPlane,
} from '/dualcam_geom.js';

const IW = 1280, IH = 720;
const HINT = ['① 顶沿·远端', '② 顶沿·近端', '③ 底沿·近端', '④ 底沿·远端'];
const OPP_CORNER = [1, 0, 3, 2];
const vidL = document.getElementById('vidL');
const vidR = document.getElementById('vidR');
const cvs = { L: document.getElementById('cvL'), R: document.getElementById('cvR') };
const ctx = { L: cvs.L.getContext('2d'), R: cvs.R.getContext('2d') };
let activeView = 'L';
let activeWall = 0;
let drag = null;
let state = {
  aisle: 2.0,
  layout: 'same_side',
  prior: { camH: 2.84, camDist: 1.56, pitch: 45, yaw: 0 },
  views: {
    L: { name: 'L', image_size: [IW, IH], walls: emptyWalls() },
    R: { name: 'R', image_size: [IW, IH], walls: emptyWalls() },
  },
  slot_meshes: [],
  contact_m: 0,
  only_active_wall: true,
  hide_solved_overlay: true,
};

function onlyActiveWallOn() {
  return document.getElementById('onlyActiveWall').checked;
}

function hideSolvedOverlayOn() {
  return document.getElementById('hideSolvedOverlay').checked;
}

function syncOverlayPrefs() {
  state.only_active_wall = onlyActiveWallOn();
  state.hide_solved_overlay = hideSolvedOverlayOn();
}

function isSameSide() {
  return (document.getElementById('layout').value || state.layout) === 'same_side';
}

function singleWallOn() {
  return document.getElementById('singleWall').checked;
}

function activeWallId() {
  const w = wallsOf('L')[activeWall];
  return w ? w.wall_id : 1;
}

function syncLayoutUi() {
  state.layout = document.getElementById('layout').value || 'opposite';
  const same = state.layout === 'same_side';
  document.querySelectorAll('.same-side-only').forEach((el) => {
    el.style.display = same ? 'flex' : 'none';
  });
  document.getElementById('priorHint').textContent = same
    ? '卷尺初值。同侧除相机高、离近端外，还要填每路到 81/82 的俯视法向距；两侧距之和应等于巷道净宽。点序仍相对本机，近对近，不对调。'
    : '卷尺初值（先验，可改）。相机高、离近端分左右路，两端可以不同。对向对齐会把右路近端对到左路远端。';
  const one = singleWallOn();
  document.getElementById('intro').innerHTML = one
    ? '左右路都在，但<strong>只标同一面墙</strong>（表格里点选墙1或墙2）。另一面留空，不参与反解。点序相对本机 ①顶远 ②顶近 ③底近 ④底远。'
    : (same
      ? '同侧同向：墙1=81（绿）、墙2=82（紫）。两面都标齐会一起对齐；只标同一面也可以反解。点序相对本机 ①顶远 ②顶近 ③底近 ④底远，<strong>近对近</strong>。'
      : '每一路都能标<strong>左右两面墙</strong>：墙1 绿色（81）、墙2 紫色（82）。点表格或点画面上的墙切换；点哪路画面就标哪路。点序相对本机 ①顶远 ②顶近 ③底近 ④底远。');
}

function setCalibPath(path) {
  const el = document.getElementById('calibPath');
  if (el && path) el.textContent = path;
}

function emptyWalls() {
  return [
    { wall_id: 1, width: 2.2, height: 2.0, base: 0, quad: [] },
    { wall_id: 2, width: 2.2, height: 2.0, base: 0, quad: [] },
  ];
}

function wallsOf(v) { return state.views[v].walls; }
function solved() { return (state.solved && state.solved.ok) ? state.solved : null; }
function camOf(v) { return solved() && solved().cameras[v]; }
function meshOf(wallId) {
  return (state.slot_meshes || []).find((m) => m.wall_id === wallId) || null;
}

function wallTint(wallId) {
  return wallId === 2
    ? { on: '#d89bff', off: '#7a5a9a', fillOn: 'rgba(180,120,255,.14)', fillOff: 'rgba(180,120,255,.06)', slot: '#c9a0ff' }
    : { on: '#5cf08a', off: '#4a8a5f', fillOn: 'rgba(92,240,138,.12)', fillOff: 'rgba(92,240,138,.05)', slot: '#7ec8ff' };
}

function wallIndexById(id) {
  return wallsOf('L').findIndex((w) => w.wall_id === id);
}

function setActiveWall(i) {
  if (i < 0 || i === activeWall) return;
  activeWall = i;
  syncInputsFromMesh();
}

function renderRows() {
  const tb = document.getElementById('rows');
  const wL = wallsOf('L'), wR = wallsOf('R');
  tb.innerHTML = wL.map((w, i) => `
    <tr class="${i === activeWall ? 'active' : ''} w${w.wall_id}" data-i="${i}">
      <td>墙${w.wall_id}${isSameSide() ? (w.wall_id === 1 ? ' · 81' : ' · 82') : ''}</td>
      <td><input type="number" step="0.01" data-k="width" value="${w.width}"></td>
      <td><input type="number" step="0.01" data-k="height" value="${w.height}"></td>
      <td><input type="number" step="0.01" data-k="base" value="${w.base}"></td>
      <td>${wL[i].quad.length}/4</td>
      <td>${wR[i].quad.length}/4</td>
    </tr>`).join('');
  for (const tr of tb.querySelectorAll('tr')) {
    const i = Number(tr.dataset.i);
    tr.addEventListener('click', (e) => {
      if (e.target.tagName === 'INPUT') return;
      setActiveWall(i);
      renderRows();
      hint();
      draw();
    });
    for (const inp of tr.querySelectorAll('input')) {
      inp.addEventListener('change', () => {
        const k = inp.dataset.k, val = Number(inp.value);
        wL[i][k] = val;
        wR[i][k] = val;
      });
    }
  }
  hint();
}

function wallReady(v, wallId) {
  const w = wallsOf(v).find((x) => x.wall_id === wallId);
  return !!(w && w.quad.length === 4);
}

function hint() {
  const w = wallsOf(activeView)[activeWall];
  const el = document.getElementById('hint');
  const mesh = meshOf(w.wall_id);
  const side = activeView === 'L' ? '左路' : '右路';
  if (singleWallOn() && w.quad.length < 4) {
    el.textContent = `${side} 墙${w.wall_id}：点 ${HINT[w.quad.length]}。左右路都只标这一面，标满四角再反解。`;
  } else if (w.quad.length < 4) {
    el.textContent = `${side} 墙${w.wall_id}：点 ${HINT[w.quad.length]}。标完一面后点表格换墙，或直接点另一面已有的角。`;
  } else if (singleWallOn() && !solved()) {
    const id = w.wall_id;
    const miss = ['L', 'R'].filter((v) => !wallReady(v, id));
    el.textContent = miss.length
      ? `墙${id} 还差 ${miss.map((v) => (v === 'L' ? '左路' : '右路')).join('、')} 的四角。另一面留空即可。`
      : `左右路都标齐了墙${id}。点「1. 反解并对齐」。未标的另一面不参与。`;
  } else if (!solved()) {
    el.textContent = `当前这面四角已齐。另一面可继续标；只标同一面时勾选「两路只标同一面」再反解。`;
  } else if (!mesh) {
    el.textContent = `当前墙${w.wall_id}。点「生成本墙层线」，再逐条拖分格线对齐隔板。`;
  } else {
    el.textContent = `当前墙${w.wall_id}。拖每条水平分格线改该层高度；顶沿和底沿跟着墙走。`;
  }
  const parts = (state.slot_meshes || []).map((m) => `墙${m.wall_id} ${m.rows}层×${m.cols}列`);
  document.getElementById('slotCount').textContent = parts.length
    ? parts.join(' · ') + '（表格高亮的是正在改的那面）'
    : '还没有层线';
}

function fitCanvas(cv) {
  const r = cv.getBoundingClientRect();
  const w = Math.max(2, Math.floor(r.width));
  const h = Math.max(2, Math.floor(w * IH / IW));
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
}

function drawWalls(c, v, k) {
  wallsOf(v).forEach((w, wi) => {
    if (onlyActiveWallOn() && wi !== activeWall) return;
    if (!w.quad.length) return;
    const on = v === activeView && wi === activeWall;
    const t = wallTint(w.wall_id);
    c.strokeStyle = on ? t.on : t.off;
    c.lineWidth = on ? 2.2 : 1.4;
    c.beginPath();
    w.quad.forEach((p, i) => {
      const x = p[0] * k, y = p[1] * k;
      if (i === 0) c.moveTo(x, y); else c.lineTo(x, y);
    });
    if (w.quad.length === 4) {
      c.closePath();
      c.fillStyle = on ? t.fillOn : t.fillOff;
      c.fill();
    }
    c.stroke();
    w.quad.forEach((p, i) => {
      const x = p[0] * k, y = p[1] * k;
      c.beginPath();
      c.arc(x, y, 7, 0, Math.PI * 2);
      c.fillStyle = on ? t.on : t.off;
      c.fill();
      c.fillStyle = '#111';
      c.font = '11px sans-serif';
      c.textAlign = 'center';
      c.textBaseline = 'middle';
      c.fillText(String(i + 1), x, y);
    });
    const cx = w.quad.reduce((s, p) => s + p[0], 0) / w.quad.length * k;
    const cy = w.quad.reduce((s, p) => s + p[1], 0) / w.quad.length * k;
    c.fillStyle = on ? t.on : t.off;
    c.font = 'bold 12px sans-serif';
    c.textAlign = 'center';
    c.textBaseline = 'bottom';
    c.fillText(`墙${w.wall_id}`, cx, cy - 10);
  });
}

function drawSolvedCorners(c, v, k) {
  if (hideSolvedOverlayOn()) return;
  const sol = solved();
  const cam = camOf(v);
  if (!sol || !cam) return;
  const order = (v === 'R' && !isSameSide()) ? OPP_CORNER : [0, 1, 2, 3];
  for (const w of sol.walls || []) {
    const wi = wallsOf(v).findIndex((x) => x.wall_id === w.wall_id);
    if (wi >= 0 && onlyActiveWallOn() && wi !== activeWall) continue;
    const col = wallTint(w.wall_id).on;
    order.forEach((ci, i) => {
      const p = (w.corners || [])[ci];
      if (!p) return;
      const uv = projectPix(p, cam);
      if (!uv) return;
      const x = uv[0] * k, y = uv[1] * k;
      c.beginPath();
      c.arc(x, y, 10, 0, Math.PI * 2);
      c.strokeStyle = col;
      c.lineWidth = 1.6;
      c.stroke();
      c.fillStyle = col;
      c.font = '10px sans-serif';
      c.textAlign = 'center';
      c.textBaseline = 'bottom';
      c.fillText(String(i + 1), x, y - 12);
    });
  }
}

function drawMeshes(c, v, k) {
  const cam = camOf(v);
  if (!cam) return;
  const wallId = wallsOf(v)[activeWall].wall_id;
  for (const mesh of state.slot_meshes || []) {
    if ((singleWallOn() || onlyActiveWallOn()) && mesh.wall_id !== wallId) continue;
    const on = mesh.wall_id === wallId;
    const t = wallTint(mesh.wall_id);
    const rows = mesh.rows, cols = mesh.cols;
    // 列线：均分，只作参考
    for (let j = 0; j <= cols; j++) {
      c.beginPath();
      let started = false;
      for (let i = 0; i <= rows; i++) {
        const uv = projectPix(mesh.vertices[vertIndex(rows, cols, i, j)], cam);
        if (!uv) continue;
        const x = uv[0] * k, y = uv[1] * k;
        if (!started) { c.moveTo(x, y); started = true; } else c.lineTo(x, y);
      }
      c.strokeStyle = on ? 'rgba(180,180,180,.35)' : 'rgba(120,120,120,.2)';
      c.lineWidth = 1;
      c.stroke();
    }
    // 行线：墙上的层分格线
    for (let i = 0; i <= rows; i++) {
      const inner = i > 0 && i < rows;
      c.beginPath();
      let started = false;
      for (let j = 0; j <= cols; j++) {
        const uv = projectPix(mesh.vertices[vertIndex(rows, cols, i, j)], cam);
        if (!uv) continue;
        const x = uv[0] * k, y = uv[1] * k;
        if (!started) { c.moveTo(x, y); started = true; } else c.lineTo(x, y);
      }
      c.strokeStyle = inner ? (on ? t.slot : t.off) : (on ? t.on : t.off);
      c.lineWidth = inner ? (on ? 2.6 : 1.6) : (on ? 1.4 : 1);
      c.stroke();
    }
    const cells = meshCells(mesh);
    for (const cell of cells) {
      const a = projectPix(cell.corners[0], cam);
      const b = projectPix(cell.corners[2], cam);
      if (!a || !b) continue;
      c.fillStyle = on ? t.slot : t.off;
      c.font = '10px sans-serif';
      c.textAlign = 'center';
      c.textBaseline = 'middle';
      c.fillText(cell.box_id, (a[0] + b[0]) / 2 * k, (a[1] + b[1]) / 2 * k);
    }
  }
}

function draw() {
  for (const v of ['L', 'R']) {
    fitCanvas(cvs[v]);
    const c = ctx[v];
    c.clearRect(0, 0, cvs[v].width, cvs[v].height);
    const k = cvs[v].width / IW;
    drawWalls(c, v, k);
    drawSolvedCorners(c, v, k);
    drawMeshes(c, v, k);
  }
  document.querySelectorAll('.pane').forEach((p) => p.classList.toggle('on', p.dataset.view === activeView));
}

function evtToImg(e, v) {
  const r = cvs[v].getBoundingClientRect();
  return [
    (e.clientX - r.left) / r.width * IW,
    (e.clientY - r.top) / r.height * IH,
  ];
}

function distToSeg(px, py, ax, ay, bx, by) {
  const vx = bx - ax, vy = by - ay;
  const l2 = vx * vx + vy * vy || 1;
  let t = ((px - ax) * vx + (py - ay) * vy) / l2;
  t = Math.max(0, Math.min(1, t));
  return Math.hypot(px - (ax + t * vx), py - (ay + t * vy));
}

function hitLayerLine(v, x, y) {
  const cam = camOf(v);
  if (!cam) return null;
  let best = null, bestD = 14;
  for (const mesh of state.slot_meshes || []) {
    const rows = mesh.rows, cols = mesh.cols;
    for (let r = 1; r < rows; r++) {
      const a = projectPix(mesh.vertices[vertIndex(rows, cols, r, 0)], cam);
      const b = projectPix(mesh.vertices[vertIndex(rows, cols, r, cols)], cam);
      if (!a || !b) continue;
      const d = distToSeg(x, y, a[0], a[1], b[0], b[1]);
      if (d < bestD) { bestD = d; best = { wallId: mesh.wall_id, r }; }
    }
  }
  return best;
}

function nLayers() {
  return Math.max(1, Number(document.getElementById('nLayers').value) || 4);
}
function nCols() {
  return Math.max(1, Number(document.getElementById('nCols').value) || 4);
}

function putMesh(mesh) {
  const i = (state.slot_meshes || []).findIndex((m) => m.wall_id === mesh.wall_id);
  if (i < 0) state.slot_meshes = [...(state.slot_meshes || []), mesh];
  else state.slot_meshes[i] = mesh;
  const active = wallsOf('L')[activeWall];
  if (active && mesh.wall_id === active.wall_id) {
    document.getElementById('nLayers').value = String(mesh.n_layers || mesh.rows);
    document.getElementById('nCols').value = String(mesh.cols);
  }
  return mesh;
}

function syncInputsFromMesh() {
  const w = wallsOf('L')[activeWall];
  const m = w && meshOf(w.wall_id);
  if (!m) return;
  document.getElementById('nLayers').value = String(m.n_layers || m.rows);
  document.getElementById('nCols').value = String(m.cols);
}

function applyMesh(wallId, layers, cols) {
  const sol = solved();
  const wall = sol && wallById(sol, wallId);
  if (!wall) return null;
  return putMesh(makeLayerMesh(wallId, wall.corners, 0, layers, cols));
}

function applyMeshKeepRows(wallId, cols) {
  const sol = solved();
  const wall = sol && wallById(sol, wallId);
  const mesh = meshOf(wallId);
  if (!wall || !mesh) return applyMesh(wallId, nLayers(), cols);
  return putMesh(meshFromRowYs(wallId, wall.corners, rowYsFromMesh(mesh), cols));
}

function dragRowLine(wallId, r, p) {
  const sol = solved();
  const wall = sol && wallById(sol, wallId);
  const mesh = meshOf(wallId);
  if (!wall || !mesh || !p) return null;
  return putMesh(moveLayerRow(mesh, wall.corners, r, p[1]));
}

function hitWallCorner(v, x, y) {
  let best = null, bestD = 24;
  wallsOf(v).forEach((w, wi) => {
    w.quad.forEach((p, i) => {
      const d = Math.hypot(p[0] - x, p[1] - y);
      if (d < bestD) { bestD = d; best = { wi, i }; }
    });
  });
  return best;
}

function hitWallQuad(v, x, y) {
  for (let wi = 0; wi < wallsOf(v).length; wi++) {
    const q = wallsOf(v)[wi].quad;
    if (q.length === 4 && pointInPolygon([x, y], q)) return wi;
  }
  return -1;
}

function incompleteWall(v) {
  return wallsOf(v).findIndex((w) => w.quad.length < 4);
}

for (const v of ['L', 'R']) {
  const cv = cvs[v];
  cv.addEventListener('pointerdown', (e) => {
    activeView = v;
    const [x, y] = evtToImg(e, v);
    const hl = hitLayerLine(v, x, y);
    if (hl) {
      setActiveWall(wallIndexById(hl.wallId));
      drag = { kind: 'line', view: v, r: hl.r, wallId: hl.wallId };
      cv.setPointerCapture(e.pointerId);
      renderRows(); hint(); draw();
      return;
    }
    const hc = hitWallCorner(v, x, y);
    if (hc) {
      setActiveWall(hc.wi);
      drag = { kind: 'wall', view: v, i: hc.i };
      cv.setPointerCapture(e.pointerId);
      renderRows(); hint(); draw();
      return;
    }
    const hq = hitWallQuad(v, x, y);
    if (hq >= 0) {
      setActiveWall(hq);
      renderRows(); hint(); draw();
      return;
    }
    let wi = activeWall;
    if (!singleWallOn() && wallsOf(v)[wi].quad.length >= 4) {
      const other = incompleteWall(v);
      if (other >= 0) wi = other;
    }
    setActiveWall(wi);
    const w = wallsOf(v)[wi];
    if (w.quad.length < 4) w.quad.push([x, y]);
    renderRows(); hint(); draw();
  });
  cv.addEventListener('pointermove', (e) => {
    if (!drag || drag.view !== v) return;
    const [x, y] = evtToImg(e, v);
    if (drag.kind === 'wall') {
      wallsOf(v)[activeWall].quad[drag.i] = [x, y];
    } else if (drag.kind === 'line') {
      const sol = solved();
      const cam = camOf(v);
      const wall = sol && wallById(sol, drag.wallId);
      if (!sol || !cam || !wall) return;
      const { p0, n } = wallPlane(wall.corners);
      const p = rayPlane(x, y, cam, p0, n);
      if (p) dragRowLine(drag.wallId, drag.r, p);
      hint();
    }
    draw();
  });
  cv.addEventListener('pointerup', () => { drag = null; });
}

function numOrBlank(id) {
  const raw = document.getElementById(id).value;
  if (raw === '' || raw == null) return null;
  const n = Number(raw);
  return Number.isFinite(n) ? n : null;
}

function viewPrior(camH, camDist, d81, d82) {
  const prior = {
    camH,
    camDist,
    pitch: Number(document.getElementById('pitch').value),
    yaw: 0,
  };
  if (d81 != null) {
    prior.wallDist1 = d81;
    prior.wallDist81 = d81;
  }
  if (d82 != null) {
    prior.wallDist2 = d82;
    prior.wallDist82 = d82;
  }
  return prior;
}

function maybeFillAisleFromWallDists() {
  if (!isSameSide()) return;
  const a = numOrBlank('wallDist81L'), b = numOrBlank('wallDist82L');
  if (a == null || b == null) return;
  document.getElementById('aisle').value = (a + b).toFixed(2);
}

function collect() {
  syncLayoutUi();
  state.aisle = Number(document.getElementById('aisle').value);
  const pL = viewPrior(
    Number(document.getElementById('camHL').value),
    Number(document.getElementById('camDistL').value),
    numOrBlank('wallDist81L'),
    numOrBlank('wallDist82L'),
  );
  const pR = viewPrior(
    Number(document.getElementById('camHR').value),
    Number(document.getElementById('camDistR').value),
    numOrBlank('wallDist81R'),
    numOrBlank('wallDist82R'),
  );
  state.prior = pL;
  state.views.L.prior = pL;
  state.views.R.prior = pR;
  state.contact_m = Number(document.getElementById('contactM').value);
  syncOverlayPrefs();
  state.single_wall = singleWallOn();
  state.active_wall_id = activeWallId();
  const mode = document.getElementById('videoMode').value || 'stitched';
  if (mode === 'split') {
    state.video_sources = {
      mode: 'split',
      L: document.getElementById('videoSrcL').value,
      R: document.getElementById('videoSrcR').value,
      src: document.getElementById('videoSrcL').value,
    };
  } else {
    const src = document.getElementById('videoSrc').value || 'output/dualcam/src.mp4';
    const prev = state.video_sources || {};
    state.video_sources = {
      mode: 'stitched',
      src,
      L: prev.L || 'data/test-144.mp4',
      R: prev.R || 'data/test-24.mp4',
    };
  }
  state.calib_id = 'dual_144-24';
  state.views.L.image_size = [IW, IH];
  state.views.R.image_size = [IW, IH];
  return payloadForPost();
}

function payloadForPost() {
  const body = JSON.parse(JSON.stringify(state));
  if (!singleWallOn()) {
    body.single_wall = false;
    return body;
  }
  const id = activeWallId();
  body.single_wall = true;
  body.active_wall_id = id;
  for (const v of ['L', 'R']) {
    for (const w of body.views[v].walls) {
      if (w.wall_id !== id) w.quad = [];
    }
  }
  body.slot_meshes = (body.slot_meshes || []).filter((m) => m.wall_id === id);
  return body;
}

async function post(path) {
  const r = await fetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(collect()),
  });
  return r.json();
}

function upsertMesh(wallId) {
  return applyMesh(wallId, nLayers(), nCols());
}

function solveSummary(res) {
  const pv = res.per_view || {};
  const a = pv.L || {};
  const b = pv.R || {};
  const cams = res.cameras || {};
  const rp = res.wall_reproj_px || {};
  const fmtRp = (side) => {
    const m = rp[side] || {};
    const parts = Object.keys(m).sort().map((k) => `墙${k} ${m[k]}px`);
    return parts.length ? parts.join(' · ') : '—';
  };
  let extra = '';
  const r2 = (rp.R || {})[2];
  if (r2 != null && r2 > 40) {
    extra = `\n⚠ 右路墙2 3D 与标注偏差 ${r2}px：请核对 82 四角、到82法向距，或删层线后重生成。`;
  }
  const walls = (res.align_wall_ids || []).length === 1 ? ` · 只用墙${res.align_wall_ids[0]}` : '';
  return `布局 ${res.layout || state.layout} · 单路残差 L ${a.resid_px}px · R ${b.resid_px}px\n` +
    `对齐 ${res.align_rms_m} m · 尺度 ${res.align_scale}${walls}\n` +
    `3D重投影 L：${fmtRp('L')} · R：${fmtRp('R')}\n` +
    `左相机高 ${cams.L && cams.L.camH} m · 右 ${cams.R && cams.R.camH} m\n` +
    `空心圆是反解投回的角，实心点是你点的角。${extra}`;
}

document.getElementById('btnSolve').onclick = async () => {
  if (singleWallOn()) {
    const id = activeWallId();
    const miss = ['L', 'R'].filter((v) => !wallReady(v, id));
    if (miss.length) {
      document.getElementById('msg').textContent =
        `墙${id} 还没标满：${miss.map((v) => (v === 'L' ? '左路' : '右路')).join('、')}。左右路都要有这一面的四角。`;
      return;
    }
  }
  const hintEl = document.getElementById('hint');
  const msgEl = document.getElementById('msg');
  hintEl.textContent = '求解中…';
  msgEl.textContent = '求解中…';
  try {
    const res = await post('/api/solve');
    if (!res.ok) {
      const err = res.error || '失败';
      hintEl.textContent = err;
      msgEl.textContent = err;
      return;
    }
    state.solved = res;
    if (res.path) setCalibPath(res.path);
    const summary = solveSummary(res);
    hintEl.textContent = summary;
    msgEl.textContent = summary;
    document.getElementById('hideSolvedOverlay').checked = false;
    syncOverlayPrefs();
    const kept = [];
    for (const m of state.slot_meshes || []) {
      const wall = wallById(res, m.wall_id);
      if (!wall || !wall.corners) continue;
      kept.push(putMesh(meshFromRowYs(m.wall_id, wall.corners, rowYsFromMesh(m), m.cols)));
    }
    state.slot_meshes = kept;
    hint();
    hintEl.textContent = summary + '\n' + hintEl.textContent;
    draw();
  } catch (e) {
    const err = '反解结果没画出来：' + (e && e.message ? e.message : e);
    hintEl.textContent = err;
    msgEl.textContent = err;
  }
};

function restoreForm(saved) {
  state = saved;
  if (!state.views) return;
  if (!Array.isArray(state.slot_meshes)) state.slot_meshes = [];
  if (saved.single_wall && saved.active_wall_id != null) {
    state.slot_meshes = state.slot_meshes.filter((m) => m.wall_id === saved.active_wall_id);
  }
  if (!state.views.L) state.views.L = { name: 'L', image_size: [IW, IH], walls: emptyWalls() };
  if (!state.views.R) state.views.R = { name: 'R', image_size: [IW, IH], walls: emptyWalls() };
  if (saved.aisle) document.getElementById('aisle').value = saved.aisle;
  const p = saved.prior || {};
  const pL = (saved.views.L && saved.views.L.prior) || p;
  const pR = (saved.views.R && saved.views.R.prior) || p;
  if (pL.camH) document.getElementById('camHL').value = pL.camH;
  if (pR.camH) document.getElementById('camHR').value = pR.camH;
  if (pL.camDist || p.camDist) document.getElementById('camDistL').value = pL.camDist || p.camDist;
  if (pR.camDist || p.camDist) document.getElementById('camDistR').value = pR.camDist || p.camDist;
  if (pL.pitch || p.pitch) document.getElementById('pitch').value = pL.pitch || p.pitch;
  const layoutRaw = saved.layout || saved.stereo_layout || 'same_side';
  document.getElementById('layout').value =
    (layoutRaw === 'same_side' || layoutRaw === 'same') ? 'same_side' : 'opposite';
  const wallDistOf = (pr, walls, id, keys) => {
    for (const k of keys) {
      if (pr && pr[k]) return pr[k];
    }
    if (pr && pr.wallDists && (pr.wallDists[id] || pr.wallDists[String(id)])) {
      return pr.wallDists[id] || pr.wallDists[String(id)];
    }
    const w = (walls || []).find((x) => x.wall_id === id);
    return w && w.normal_dist;
  };
  const d81 = (pr, walls) => wallDistOf(pr, walls, 1, ['wallDist81', 'wallDist1']);
  const d82 = (pr, walls) => wallDistOf(pr, walls, 2, ['wallDist82', 'wallDist2']);
  const wL = saved.views.L && saved.views.L.walls;
  const wR = saved.views.R && saved.views.R.walls;
  document.getElementById('wallDist81L').value = d81(pL, wL) || '';
  document.getElementById('wallDist82L').value = d82(pL, wL) || '';
  document.getElementById('wallDist81R').value = d81(pR, wR) || '';
  document.getElementById('wallDist82R').value = d82(pR, wR) || '';
  if (saved.contact_m != null) document.getElementById('contactM').value = saved.contact_m;
  if (saved.only_active_wall != null) {
    document.getElementById('onlyActiveWall').checked = !!saved.only_active_wall;
  }
  document.getElementById('singleWall').checked = !!saved.single_wall;
  if (saved.active_wall_id != null && wL) {
    const idx = wL.findIndex((w) => w.wall_id === saved.active_wall_id);
    if (idx >= 0) activeWall = idx;
  }
  if (saved.hide_solved_overlay != null) {
    document.getElementById('hideSolvedOverlay').checked = !!saved.hide_solved_overlay;
  }
  if (saved.calib_path) setCalibPath(saved.calib_path);
  syncOverlayPrefs();
  const m = (state.slot_meshes || [])[0];
  if (m) {
    document.getElementById('nLayers').value = String(m.n_layers || m.rows || 4);
    document.getElementById('nCols').value = String(m.cols || 4);
  }
  syncLayoutUi();
  renderRows();
  hint();
  draw();
}

(async () => {
  const videos = await fetch('/api/videos').then((r) => r.json()).then((j) => j.videos || []).catch(() => []);
  const pref = readVideoPref() || { mode: 'stitched', src: 'output/dualcam/src.mp4' };
  const split = pref.mode === 'split';
  document.getElementById('videoMode').value = split ? 'split' : 'stitched';
  fillVideoSelect(document.getElementById('videoSrc'), videos, pref.src || 'output/dualcam/src.mp4');
  fillVideoSelect(document.getElementById('videoSrcL'), videos, pref.L || pref.src || 'output/dualcam/src.mp4');
  fillVideoSelect(document.getElementById('videoSrcR'), videos, pref.R || pref.src || 'output/dualcam/src.mp4');
  document.getElementById('layout').addEventListener('change', () => {
    syncLayoutUi();
    renderRows();
    draw();
  });
  document.getElementById('singleWall').addEventListener('change', () => {
    state.single_wall = singleWallOn();
    syncLayoutUi();
    hint();
    draw();
  });
  document.getElementById('videoMode').addEventListener('change', applyVideo);
  for (const id of ['videoSrc', 'videoSrcL', 'videoSrcR']) {
    document.getElementById(id).addEventListener('change', applyVideo);
  }
  for (const id of ['wallDist81L', 'wallDist82L']) {
    document.getElementById(id).addEventListener('change', maybeFillAisleFromWallDists);
  }
  document.getElementById('nLayers').addEventListener('change', () => {
    const w = wallsOf('L')[activeWall];
    if (solved() && meshOf(w.wall_id)) applyMesh(w.wall_id, nLayers(), nCols());
    hint(); draw();
  });
  document.getElementById('nCols').addEventListener('change', () => {
    const w = wallsOf('L')[activeWall];
    if (solved() && meshOf(w.wall_id)) applyMeshKeepRows(w.wall_id, nCols());
    hint(); draw();
  });
  const data = await fetch('/api/calib?' + calibQuery()).then((r) => r.json()).catch(() => ({}));
  if (data.views) restoreForm(data);
  else if (data.calib_path) setCalibPath(data.calib_path);
  syncLayoutUi();
  renderRows();
  applyVideo();
  applyVideo.ready = true;
  writeVideoPref();
  draw();
})();
</script>
</body>
</html>
